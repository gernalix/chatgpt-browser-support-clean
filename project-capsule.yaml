safety:
  invariants:
  - No browser credentials, profile/session data, private conversations or endpoints
    with secrets in Git/output.
  - Real operations require a separately authorized session and must preserve ownership/launch-safety
    boundaries.
  - No implicit task claiming, Pn/Batch creation or retired lifecycle writes.
  risky_operations:
  - Real database rebuild/migration, deployment, credential cutover, lifecycle/notification
    and browser operations require the appropriate explicit scope.
  recovery:
  - Preserve original source/data and prior good copies; use owning semantic writers
    and consistent private backups.
acceptance:
- FAST validates registered identity, referenced source paths, commands and reviewed-source
  freshness.
- FULL passes the declared isolated suite; it does not infer live runtime, account,
  archive or data completeness.
- No service, credentials, provider, private source or existing database is changed
  during capsule verification.
references:
  megavault: /home/daniele/MegaVault/megavault.sqlite
  c2: Historical-only /home/daniele/projects/codex-roadmap/roadmap.sqlite; no lifecycle
    writes or dispatcher use.
