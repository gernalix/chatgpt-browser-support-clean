schema_version: c2.project-capsule.v1
identity:
  project_id: 105
  slug: chatgpt-rdc-supervisor
  repository_id: R0106
scope:
  purpose: Provide on-demand browser transport/helpers only, with retired global supervision
    and lifecycle entrypoints remaining fail-closed.
  boundaries:
  - Do not launch/control a real browser, inspect accounts/projects or contact ChatGPT
    during capsule verification.
  - Global supervision, rollover/recovery, lifecycle registration/resume and historical
    installers remain permanently retired.
  - The systemd templates are inert source files, not a requested installation.
repository:
  canonical_workdir: /home/daniele/.local/share/megavault/worktrees/chatgpt-browser-support-clean
  branch_policy: Use isolated task worktrees and the installed Git single writer;
    preserve existing primary names, all valid work and concurrent ownership.
architecture:
  summary: src/chatgpt_rdc_supervisor/browser.py owns bounded browser channel/page/composer
    operations; safety.py enforces launch checks; storage/model/checkpoint modules
    hold private operation context. cli.py exposes requested diagnostics/helpers while
    retired supervision, discovery, registration/resume and installers reject. Tests
    use fake browser objects and temporary storage.
  entrypoints:
  - src/chatgpt_rdc_supervisor/cli.py
  important_paths:
  - src/chatgpt_rdc_supervisor
  - tests
  - README.md
  - pyproject.toml
dependencies:
- name: Python and system SQLite where applicable
  purpose: Existing source and isolated offline fixture checks.
- name: Bubblewrap
  purpose: Read-only source, masked private home/runtime/data/devices, isolated network
    and processes.
- name: Playwright and websockets
  purpose: Existing browser transport dependencies; tests use fake objects, not a
    real authenticated session.
data:
  schema: Browser endpoints, profiles, chat/session content and checkpoints belong
    in private runtime storage outside Git. This package owns no task lifecycle, global
    queue or external source of authority. Legacy module/command names are compatibility
    only.
  migrations: Preserve private checkpoints and existing source context; do not reactivate
    retired control planes or infer a task resume from a doctor/connectivity result.
    Source integration does not install inert service templates.
runtime:
  services: []
  timers: []
  containers: []
devices: []
