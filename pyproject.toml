[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-rdc-supervisor"
version = "0.1.0"
description = "On-demand browser support with retired global supervision"
requires-python = ">=3.11"
dependencies = ["playwright>=1.61", "websockets>=15,<16"]

[project.scripts]
chatgpt-rdc-supervisor = "chatgpt_rdc_supervisor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
